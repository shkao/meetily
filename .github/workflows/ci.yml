name: CI

# Fast checks on every PR and push: TypeScript + frontend tests on Linux, Rust unit tests on macOS
# (the primary platform; macOS runners are free for public repos). Builds and releases stay in the
# manual build-*.yml / release.yml workflows.

on:
  pull_request:
  push:
    branches: [main, devtest]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tsc + bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: bun test

  rust:
    name: Rust unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tauri-build requires every externalBin to exist. No unit test runs the llama-helper sidecar,
      # so a placeholder avoids building llama.cpp here. build.rs downloads ffmpeg itself.
      - name: Placeholder llama-helper sidecar
        run: |
          mkdir -p frontend/src-tauri/binaries
          touch frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      # test_builtin_mic_detection needs a real microphone (and fails upstream until #815)
      - run: cargo test -p meetily --lib -- --skip test_builtin_mic_detection
      - name: llama-helper unit tests
        run: cargo test -p llama-helper --bins
